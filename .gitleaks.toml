# Secret scanning for this PUBLIC repo. Used by scripts/check-secrets.sh (pre-commit/pre-push) and CI.
title = "distributed-infra"

[extend]
useDefault = true            # gitleaks' built-in rules: cloud keys, tokens, private keys, ...

# This project's own rules.
[[rules]]
id = "tailscale-auth-key"
description = "Tailscale auth key"
regex = '''tskey-(auth|api|client)-[A-Za-z0-9]{8,}(-[A-Za-z0-9]+)?'''

[[rules]]
id = "tailnet-device-ip"
description = "A real Tailscale device address (100.64.0.0/10). Use a placeholder such as <mac-mini-ip> in docs and 100.64.0.x in tests."
regex = '''\b100\.(6[5-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b|\b100\.64\.[1-9][0-9]{0,2}\.[0-9]{1,3}\b'''
tags = ["network"]

[[rules]]
id = "env-assignment-with-value"
description = "KEY=value for a secret-looking name in a tracked file (use the .env file, not a committed file)"
regex = '''(?i)\b(SECRET_KEY|INFRA_SECRET_KEY|WAHA_API_KEY|DEEPSEEK_API|VANTAGE_INGEST_KEY|[A-Z0-9_]*PASSWORD|[A-Z0-9_]*APP_PASSWORD)\s*[:=]\s*["']?[A-Za-z0-9+/_\-]{20,}["']?'''
tags = ["env"]

# No whole-file allowlists: a real secret added next to a fixture must still be caught. Each entry below
# names ONE rule and matches the complete synthetic value (anchored ^...$), so any other value fails.
# Exact finding fingerprints from old history live in .gitleaksignore.
[[allowlists]]
description = "Placeholder values shipped in the .env.example files"
targetRules = ["env-assignment-with-value"]
regexTarget = "match"
regexes = [
  '''^SECRET_KEY=changeme-generate-with-openssl-rand-hex-32$''',
  '''^INFRA_SECRET_KEY=your-secret-key-here$''',
  '''^WAHA_API_KEY=generate-with-openssl-rand-hex-16$''',
  '''^WAHA_DASHBOARD_PASSWORD=your-dashboard-password$''',
]

[[allowlists]]
description = "Fake AWS key that tests/test_roles.py feeds to the privacy filter"
targetRules = ["aws-access-token"]
regexTarget = "match"
regexes = ['''^AKIAABCDEFGHIJKLMNOP$''']

[[allowlists]]
description = "Fake Stripe key that tests/test_roles.py feeds to the privacy filter"
targetRules = ["stripe-access-token"]
regexTarget = "match"
regexes = ['''^sk_live_abcdefgh12345678\s?$''']
