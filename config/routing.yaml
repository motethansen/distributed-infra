# Model routing policy (Track #5). Picks the cheapest agent+model that fits a
# request. Read by agents/router.py. This file is fleet-wide policy (no secrets) —
# it IS tracked in git, unlike machines.yaml/.env.
#
# How it resolves (see router.py):
#   1. sensitivity in {private,sensitive,personal,...}  -> force the `privacy` class
#   2. else task_kind -> class via `task_kinds`
#   3. class -> {agent, model} via `classes`
#   4. a caller-supplied agent/model overrides the class choice...
#   5. ...EXCEPT the privacy guard: privacy/sensitive work is never sent to a
#      non-private (cloud-CN) provider — it is rerouted to `privacy_fallback`.
#
# Opus stays blocked by claude_agent's cost policy regardless of what is set here.

default_class: default

classes:
  # privacy: email / finance / calendar / personal — Claude cloud only for now;
  # routes to the local model once #7 (dedicated LLM machine) lands.
  privacy:    { agent: claude,   model: sonnet }
  # coding (WRITES files) / planning — quality matters, use Sonnet.
  coding:     { agent: claude,   model: sonnet }
  planning:   { agent: claude,   model: sonnet }
  # review — Sonnet reads the code and the repo and reports; read-only work.
  review:     { agent: claude,   model: sonnet }
  # verify — an INDEPENDENT second opinion on someone else's change or answer.
  # Codex is a different model family (so it does not share Sonnet's blind spots)
  # and runs in a read-only sandbox, which is exactly right for checking, not editing.
  verify:     { agent: codex }
  # research — long documents, many sources, broad synthesis: Gemini (agy) has the
  # largest context. Non-sensitive research may fall to DeepSeek; private never does.
  research:   { agent: agy }
  # cheap reasoning / bulk summarization — DeepSeek (non-sensitive only).
  reasoning:  { agent: deepseek, model: deepseek-reasoner }
  bulk:       { agent: deepseek, model: deepseek-chat }
  # mechanical: classify / route / reformat / extract — cheap cloud (Haiku);
  # local once #7 lands.
  mechanical: { agent: claude,   model: haiku }
  # fallback when nothing else matches.
  default:    { agent: claude,   model: sonnet }

# Natural task_kind keywords a caller can pass -> class.
task_kinds:
  code: coding
  coding: coding
  fix: coding
  refactor: coding
  implement: coding
  review: review
  code_review: review
  verify: verify
  second_opinion: verify
  debug: verify
  explain: verify
  audit: verify
  plan: planning
  planning: planning
  decompose: planning
  supervise: planning
  reason: reasoning
  reasoning: reasoning
  analyze: reasoning
  research: research
  long_context: research
  docs: research
  bulk: bulk
  summarize: bulk
  summarise: bulk
  draft: bulk
  brainstorm: bulk
  classify: mechanical
  route: mechanical
  reformat: mechanical
  extract: mechanical
  tag: mechanical
  mechanical: mechanical
  # privacy-class kinds (also force-triggered by sensitivity)
  email: privacy
  finance: privacy
  portfolio: privacy
  calendar: privacy
  personal: privacy
  private: privacy

# ── Privacy guard (hard rule) ──────────────────────────────────────────────────
# Classes whose data must never leave to a non-private provider.
privacy_classes: [privacy]
# Sensitivity values that force the privacy class.
sensitive_values: [private, privacy, sensitive, personal, confidential, secret]
# Providers considered non-private (China-hosted / cloud-CN). Privacy work is
# rerouted away from these even if explicitly requested.
non_private_agents: [deepseek]
# Where privacy work goes when the guard trips (until #7's local model exists).
privacy_fallback: { agent: claude, model: sonnet }

# ── Failover (agents/failover.py) ──────────────────────────────────────────────
# When the routed agent is UNAVAILABLE — usage/session limit, rate limit, quota,
# overloaded, or not installed/logged in — the task moves to the next agent in
# its class's list, in order. Other failures (timeouts, real errors) still stop
# and wait for a human. A limited agent is skipped until the reset time it
# reported. The privacy guard above applies to every fallback too, so `deepseek`
# is never used for privacy-class work even if listed. Disable per task with
# payload `failover: false`. A pinned agent with no task_kind uses `default`.
fallbacks:
  privacy:    [ { agent: codex }, { agent: agy } ]
  # coding WRITES files: agy can (permissions bypassed like Claude), codex runs
  # read-only here, so it goes last — it would answer without making the change.
  coding:     [ { agent: agy }, { agent: codex } ]
  planning:   [ { agent: codex }, { agent: agy } ]
  review:     [ { agent: codex }, { agent: agy } ]
  verify:     [ { agent: claude, model: sonnet }, { agent: agy } ]
  research:   [ { agent: deepseek, model: deepseek-reasoner }, { agent: claude, model: sonnet }, { agent: codex } ]
  reasoning:  [ { agent: claude, model: sonnet }, { agent: codex }, { agent: agy } ]
  bulk:       [ { agent: claude, model: haiku }, { agent: codex }, { agent: agy } ]
  mechanical: [ { agent: deepseek, model: deepseek-chat }, { agent: codex }, { agent: agy } ]
  default:    [ { agent: codex }, { agent: agy }, { agent: deepseek, model: deepseek-chat } ]
