# Projects the Scrum flow can work on, and the machines that can be assigned. Tracked, no secrets.
# `repo` is the clone URL a worker uses when it has no checkout yet; `dir` is the folder name to look for.
# Workers keep clones in different places (~/Projects/<dir>, ~/Projects/github/<org>/<dir>), so the
# task prompt tells the agent to find an existing clone before cloning.

# A sprint is 1-2 days of AGENT work. Human steps do not count. Calibrate from velocity after two real sprints.
sprint_capacity_points: 15

machines:
  mac-mini:    "macOS, always on. iOS/Xcode/Flutter builds, the orchestrator, WhatsApp bridge, Docker. Prefer for anything Apple or long-running."
  thinkpad-x1: "Linux. Android, Python, Node, Docker; second orchestrator. Prefer for Linux/Android work and to spread load."
# macbook-pro is Michael's own machine: no work is assigned to it.

projects:
  # Stories for this repo are built in a SEPARATE clone (~/Projects/distributed-infra-stories on mac-mini and
  # thinkpad-x1). ~/Projects/distributed-infra is the checkout the live orchestrator and workers run from: a story
  # branch checked out there would be loaded by the next restart, unreviewed.
  distributed-infra: { repo: "git@github.com:motethansen/distributed-infra.git", dir: distributed-infra-stories,
                       note: "work ONLY in ~/Projects/distributed-infra-stories; never edit or check out branches in ~/Projects/distributed-infra, which runs the live orchestrator. Run tests with ./.venv/bin/python -m pytest tests" }
  vantage:           { repo: "git@github.com:motethansen/service-monitor.git",   dir: service-monitor-stories,
                       note: "work ONLY in ~/Projects/service-monitor-stories; never edit or check out branches in ~/Projects/service-monitor, which is the live Vantage service on the mini. Run tests with ./.venv/bin/python -m pytest tests" }
  motethansen:       { repo: "git@github.com:motethansen/motethansen-site.git",  dir: motethansen-site }
  simtrader:         { repo: "git@github.com:motethansen/simtrader.git",         dir: simtrader }
  budgetapp:         { repo: "git@github.com:motethansen/budgetapp.git",         dir: budgetapp }
  cheersfriends:     { repo: "git@github.com:motethansen/cheersfriends.git",     dir: cheersfriends_cc, note: "backend/ and webfrontend/ are dead code; read the sprint file first" }
  winedragons:      { repo: "git@github.com:motethansen/winedragons_asia.git",  dir: winedragons_asia,
                      note: "WineDragons rules, every agent: read CLAUDE.md first. Never work in the main clone: `git worktree add ~/wt-<story> -b <branch> origin/main`, so two stories on one machine never share a working tree. Never `git add -A`: name each path. Commit and push after each green step; tests first. Functions run Python 3.9; Flutter only 3.44.8 (check `flutter --version`; the thinkpad builds the app). Never merge, deploy, run a migration, run doctl or print `.env` values. The food profile (health data), payments and the account-erasure code are sensitive: never in logs, prompts or fixtures. Test fixtures must not contain password-like literals (build them from parts) or GitGuardian fails the PR. A throwaway Postgres uses a port nobody has (55480 plus a random number below 30) and its own /tmp/<story>-pg: check pg_isready first and delete only your own. Thailand: no alcohol content (CLAUDE.md rule 9)" }
  academictool:      { repo: "git@github.com:motethansen/academictool.git", dir: academictool }
  vizneo:            { repo: "git@gitlab.com:vizneo/vizneowebsite.git", dir: vizneowebsite, note: "GitLab, deployed as a Cloudflare Worker by hand; verify the remote before cloning" }
  urbanlife:         { repo: "git@github.com:motethansen/urbanlife_works.git",   dir: urbanlife_works, note: "isolated: separate repo, deployed by hand" }
