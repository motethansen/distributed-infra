services:
  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    ports:
      # Loopback only. "3000:3000" binds 0.0.0.0, publishing a live WhatsApp
      # session to the whole tailnet and LAN. Every consumer (the bridge,
      # start-waha-session.sh) reaches WAHA at localhost:3000, so nothing needs
      # it off-host; the container still reaches the bridge via
      # host.docker.internal, which is unaffected by this bind address.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./waha-sessions:/app/.sessions
    environment:
      # Send messages (incl. those sent from the linked phone) to the bridge on the Mac Mini host.
      # `message.any` covers both incoming and your own outgoing messages, which is what we want
      # for self-chat commands — the linked phone's sends appear with fromMe=true.
      WHATSAPP_HOOK_URL: "http://host.docker.internal:3001/webhook"
      WHATSAPP_HOOK_EVENTS: "message.any"
      WHATSAPP_DEFAULT_ENGINE: "NOWEB"
      # Auto-start the persisted `default` session on container boot. Without this,
      # WAHA leaves sessions STOPPED after a restart (restart: unless-stopped only
      # restarts the container, not the WhatsApp session) and the bridge goes dark.
      # The noweb credentials in ./waha-sessions let it reconnect with no new QR.
      WAHA_AUTO_START_SESSIONS: "default"
      # Credentials come from the gitignored .env beside this file — never inline
      # them here. WAHA holds a live WhatsApp session: whoever has the API key can
      # read and send messages as you, and the dashboard login is a second way in.
      # See .env.example for the keys to set.
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME:?set in .env}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD:?set in .env}"
      WAHA_API_KEY: "${WAHA_API_KEY:?set in .env}"
